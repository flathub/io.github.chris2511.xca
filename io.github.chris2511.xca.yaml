app-id: io.github.chris2511.xca
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
finish-args:
  # X11 + XShm access
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  # Qt wants OpenGL access
  - --device=dri
  # Wayland access
  - --socket=wayland
  # Needs to save files locally
  - --filesystem=xdg-documents
cleanup:
  - /include
  - /lib/pkgconfig
  - /man
  - /share/doc
  - /share/man
  - /share/gtk-doc
  - '*.la'
  - '*.a'
command: xca
rename-desktop-file: "de.hohnstaedt.xca.desktop"
rename-icon: de.hohnstaedt.xca
modules:
  - python3-sphinx.json
  - name: xca
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
    sources:
      - type: git
        url: https://github.com/chris2511/xca.git
        tag: RELEASE.2.9.0
        commit: a2baa17f7995746b4706708e1101f02528d55399
        disable-fsckobjects: true
      - type: file
        path: "io.github.chris2511.xca.metainfo.xml"
      # 0001 not needed anymore?
      #- type: patch
      #  path: 0001-unset-werror.patch
    post-install:
      - install -Dm644 io.github.chris2511.xca.metainfo.xml /app/share/metainfo/io.github.chris2511.xca.metainfo.xml
